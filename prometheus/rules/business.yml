# 业务指标告警：直接面向交易结果，是运营和业务方最关心的那层

groups:
  - name: yunqi_mall_business
    interval: 15s
    rules:
      - alert: PaymentSuccessRateLow
        expr: |
          sum(rate(payment_callbacks_total{status="success"}[10m]))
          /
          sum(rate(payment_callbacks_total[10m])) < 0.95
        for: 3m
        labels:
          severity: P0
          category: business
        annotations:
          summary: "支付成功率低于 95%"
          description: "当前支付成功率 {{ $value | humanizePercentage }}，直接影响营收，需立即排查支付渠道。"

      - alert: OrderSuccessRateLow
        expr: |
          sum(rate(orders_total{status="success"}[10m]))
          /
          sum(rate(orders_total[10m])) < 0.9
        for: 3m
        labels:
          severity: P1
          category: business
        annotations:
          summary: "下单成功率低于 90%"
          description: "当前成功率 {{ $value | humanizePercentage }}，可能是库存扣减或风控拦截异常。"

      - alert: LoginFailureRateHigh
        expr: |
          sum(rate(logins_total{status="failed"}[10m]))
          /
          sum(rate(logins_total[10m])) > 0.1
        for: 3m
        labels:
          severity: P1
          category: business
        annotations:
          summary: "登录失败率超过 10%"
          description: "当前登录失败率 {{ $value | humanizePercentage }}，疑似用户服务异常或撞库攻击。"

      - alert: ActiveUsersDrop
        expr: active_users < 30
        for: 5m
        labels:
          severity: P1
          category: business
        annotations:
          summary: "在线用户数异常偏低"
          description: "当前在线用户 {{ $value }} 人，低于健康水位，疑似登录链路故障。"

      - alert: OrderAmountStall
        expr: |
          sum(rate(order_amount_yuan_total[10m])) == 0
          and
          sum(rate(orders_total{status="success"}[10m])) > 0
        for: 5m
        labels:
          severity: P2
          category: business
        annotations:
          summary: "成交金额长时间无增长"
          description: "有成功订单但 GMV 计数未变化，疑似金额统计埋点失效。"
