# 云启商城 API 网关入口
# 统一收敛外部流量，内部微服务不直接对外暴露端口

upstream order_service {
    server order-service:8001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream pay_service {
    server pay-service:8002 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream user_service {
    server user-service:8003 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen       80;
    server_name  mall.yunqi.local api.yunqi-mall.com;

    # ------------------------------------------------------------------ #
    # 网关自身
    # ------------------------------------------------------------------ #
    location = / {
        default_type application/json;
        return 200 '{"platform":"YunQi Mall","gateway":"nginx","version":"1.0.0","services":["order-service","pay-service","user-service"]}';
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "yunqi-mall gateway ok\n";
    }

    # 供 nginx-prometheus-exporter 抓取的连接统计
    location = /stub_status {
        stub_status;
        access_log off;
    }

    # 内部指标严禁经网关外泄
    location /metrics {
        access_log off;
        return 403;
    }

    # ------------------------------------------------------------------ #
    # 反向代理到各微服务（服务内部路由本身就带 /api/xxx 前缀）
    # ------------------------------------------------------------------ #
    location /api/order/ {
        proxy_pass http://order_service;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    location /api/pay/ {
        proxy_pass http://pay_service;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    location /api/user/ {
        proxy_pass http://user_service;
        include /etc/nginx/conf.d/proxy_common.inc;
    }
}
