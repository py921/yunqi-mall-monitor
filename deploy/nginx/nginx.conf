user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON 访问日志，方便后续接 Loki / Filebeat
    log_format  mall_json  escape=json
        '{"ts":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream":"$upstream_addr",'
        '"upstream_time":"$upstream_response_time","rid":"$request_id"}';

    access_log  /var/log/nginx/access.log  mall_json;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;
    server_tokens     off;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        application/json text/plain application/javascript text/css;

    include /etc/nginx/conf.d/*.conf;
}
